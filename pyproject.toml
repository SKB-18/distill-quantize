[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "distill-quantize"
version = "0.1.0"
description = "Production-grade Knowledge Distillation and Post-Training Quantization (PTQ) framework in PyTorch."
authors = [{ name = "Kaushik" }]
dependencies = [
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
